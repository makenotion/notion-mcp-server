name: MCP Observatory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: KryptosAI/mcp-observatory/action@main
        with:
          target: mcp-observatory.target.json
          deep: true
          security: true
          comment-on-pr: false
          set-status: false
